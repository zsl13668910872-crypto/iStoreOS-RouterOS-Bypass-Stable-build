name: Build iStoreOS 24.10.8 RouterOS Bypass Stable V2.2

on:
  workflow_dispatch:
    inputs:
      istoreos_version:
        description: 'iStoreOS 版本号或分支/标签（默认 24.10.8）'
        required: false
        type: string
        default: '24.10.8'
      enable_backup_proxy:
        description: '预装 PassWall / PassWall2 作为备用代理栈（默认开启，但默认不启动）'
        required: false
        type: boolean
        default: true
      enable_extra_proxy_stacks:
        description: '额外集成 Nikki / HomeProxy / MosDNS / SmartDNS（稳定优先，默认关闭）'
        required: false
        type: boolean
        default: false
      enable_bbr:
        description: '启用 BBR 拥塞控制（旁路由自身到机场节点的 TCP 连接受益，默认开启；开机自动检测）'
        required: false
        type: boolean
        default: true
      preload_openclash_core:
        description: '把 Mihomo(Meta) 内核预置进固件（首次开机无需联网下载；下载失败不阻断编译）'
        required: false
        type: boolean
        default: true
      lan_ipaddr:
        description: '可选：旁路由 LAN IP（留空=不改动，沿用镜像默认值；例 192.168.1.2）'
        required: false
        type: string
        default: ''
      lan_netmask:
        description: '可选：子网掩码（仅在填写 LAN IP 时生效）'
        required: false
        type: string
        default: '255.255.255.0'
      lan_gateway:
        description: '可选：网关/DNS（填 RouterOS 主路由 IP；留空=不设置）'
        required: false
        type: string
        default: ''
      publish_release:
        description: '构建成功后发布 GitHub Release'
        required: false
        type: boolean
        default: false

env:
  ISTOREOS_VERSION: ${{ inputs.istoreos_version || '24.10.8' }}
  ROOTFS_PARTSIZE: '4096'
  OPENCLASH_VERSION: '0.47.156'
  V2_VERSION: 'V2.2-iStoreOS-24.10.8-Bypass'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout custom build repo
        uses: actions/checkout@v4

      - name: Validate optional network inputs
        shell: bash
        env:
          IN_IP: ${{ inputs.lan_ipaddr }}
          IN_MASK: ${{ inputs.lan_netmask }}
          IN_GW: ${{ inputs.lan_gateway }}
        run: |
          set -euo pipefail
          ipre='^([0-9]{1,3}\.){3}[0-9]{1,3}$'
          for v in "$IN_IP" "$IN_GW"; do
            if [ -n "$v" ] && ! printf '%s' "$v" | grep -Eq "$ipre"; then
              echo "::error::非法 IPv4 地址: $v"; exit 1
            fi
          done
          if [ -n "$IN_IP" ] && ! printf '%s' "$IN_MASK" | grep -Eq "$ipre"; then
            echo "::error::非法子网掩码: $IN_MASK"; exit 1
          fi

      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3-setuptools python3-pyelftools libpython3-dev \
            rsync unzip zlib1g-dev file wget curl time libelf-dev ecj fastjar \
            java-propose-classpath python3 swig zstd subversion xsltproc qemu-utils \
            ccache xz-utils patch perl tar gzip bzip2 p7zip-full

      - name: Clone iStoreOS source
        shell: bash
        run: |
          set -euxo pipefail
          REPO_URL="https://github.com/istoreos/istoreos.git"
          TARGET_REF="${ISTOREOS_VERSION}"

          # 自动兼容带 v 前缀、istoreos- 前缀或纯分支名称的标签
          cloned=0
          for ref in "v${TARGET_REF}" "istoreos-${TARGET_REF}" "${TARGET_REF}" "istoreos-24.10"; do
            echo "[INFO] 尝试克隆分支/标签: ${ref}"
            if git clone --branch "${ref}" --single-branch --depth 1 "${REPO_URL}" istoreos; then
              echo "[OK] 成功克隆: ${ref}"
              cloned=1
              break
            fi
          done

          if [ "$cloned" -ne 1 ]; then
            echo "::error::未能成功拉取指定的 iStoreOS 版本/分支: ${TARGET_REF}"
            exit 1
          fi

      - name: Restore downloaded source archives
        uses: actions/cache/restore@v4
        with:
          path: istoreos/dl
          key: istoreos-dl-${{ env.ISTOREOS_VERSION }}-${{ github.run_id }}
          restore-keys: |
            istoreos-dl-${{ env.ISTOREOS_VERSION }}-
            istoreos-dl-

      - name: Update and install feeds
        working-directory: istoreos
        shell: bash
        env:
          BACKUP_PROXY: ${{ inputs.enable_backup_proxy }}
          EXTRA_STACKS: ${{ inputs.enable_extra_proxy_stacks }}
        run: |
          set -euo pipefail

          if [ "$BACKUP_PROXY" = 'true' ]; then
            cat >> feeds.conf.default <<'EOF'
          src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git
          src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git
          EOF
          fi

          if [ "$EXTRA_STACKS" = 'true' ]; then
            cat >> feeds.conf.default <<'EOF'
          src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git
          src-git homeproxy https://github.com/immortalwrt/homeproxy.git
          src-git mosdns https://github.com/sbwml/luci-app-mosdns.git
          EOF
          fi

          echo '===== feeds.conf.default ====='
          cat feeds.conf.default

          for attempt in 1 2 3; do
            ./scripts/feeds update -a && break || echo "[WARN] feeds update attempt ${attempt} returned non-zero"
            sleep 10
          done

          for base in packages luci; do
            if [ ! -d "feeds/${base}" ] || [ -z "$(ls -A "feeds/${base}" 2>/dev/null)" ]; then
              echo "::error::基础 feed '${base}' 更新失败，无法继续。"
              exit 1
            fi
          done

          ./scripts/feeds install -a || echo '[WARN] feeds install -a returned non-zero'

          if [ "$BACKUP_PROXY" = 'true' ]; then
            for f in passwall passwall2; do
              if [ -d "feeds/${f}" ]; then
                ./scripts/feeds install -a -f -p "$f" || true
              else
                echo "[WARN] feed ${f} 不可用，跳过覆盖。"
              fi
            done
          fi
          if [ "$EXTRA_STACKS" = 'true' ]; then
            for f in nikki homeproxy mosdns; do
              if [ -d "feeds/${f}" ]; then
                ./scripts/feeds install -a -f -p "$f" || true
              else
                echo "[WARN] feed ${f} 不可用，跳过覆盖。"
              fi
            done
          fi

      - name: Pin OpenClash source
        working-directory: istoreos
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf feeds/*/luci-app-openclash package/feeds/*/luci-app-openclash
          rm -rf package/openclash
          git clone --branch "v${OPENCLASH_VERSION}" --single-branch --depth 1 \
            https://github.com/vernesong/OpenClash.git package/openclash
          find package/openclash -maxdepth 2 -type f -name Makefile -print -quit | grep -q .

      - name: Configure target and package baseline
        working-directory: istoreos
        shell: bash
        env:
          ENABLE_BBR: ${{ inputs.enable_bbr }}
        run: |
          set -euo pipefail

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_TARGET_BOARD="x86"
          CONFIG_TARGET_SUBTARGET="64"
          CONFIG_TARGET_PROFILE="DEVICE_generic"
          CONFIG_TARGET_ARCH_PACKAGES="x86_64"
          CONFIG_x86_64=y
          CONFIG_ARCH="x86_64"

          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_EXT4_RESERVED_PCT=0
          CONFIG_TARGET_EXT4_BLOCKSIZE_4K=y
          CONFIG_TARGET_EXT4_BLOCKSIZE=4096
          CONFIG_TARGET_EXT4_JOURNAL=y
          CONFIG_GRUB_IMAGES=y
          CONFIG_GRUB_EFI_IMAGES=y
          CONFIG_GRUB_CONSOLE=y
          CONFIG_GRUB_BAUDRATE=115200
          CONFIG_GRUB_TIMEOUT="3"
          CONFIG_TARGET_KERNEL_PARTSIZE=16
          CONFIG_TARGET_ROOTFS_PARTSIZE=4096
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_PACKAGE_grub2=y
          CONFIG_PACKAGE_grub2-efi=y

          # 网络底座与代理依赖
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ethtool=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_jq=y
          CONFIG_PACKAGE_procps-ng=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_bind-host=y
          CONFIG_PACKAGE_bind-dig=y

          # 规避同文件互斥冲突
          CONFIG_PACKAGE_libustream-mbedtls=y
          # CONFIG_PACKAGE_libustream-openssl is not set
          # CONFIG_PACKAGE_libustream-wolfssl is not set
          # CONFIG_PACKAGE_tcpdump-mini is not set
          # CONFIG_PACKAGE_dnsmasq is not set
          # CONFIG_PACKAGE_dnsmasq-dhcpv6 is not set
          # CONFIG_PACKAGE_ip-tiny is not set
          # CONFIG_PACKAGE_ip-bridge is not set
          # CONFIG_PACKAGE_wget-nossl is not set

          # 锁定 OpenClash
          CONFIG_PACKAGE_luci-app-openclash=y
          EOF

          if [ "$ENABLE_BBR" = 'true' ]; then
            echo 'CONFIG_PACKAGE_kmod-tcp-bbr=y' >> .config
          fi

      - name: Select optional packages safely
        working-directory: istoreos
        shell: bash
        env:
          BACKUP_PROXY: ${{ inputs.enable_backup_proxy }}
          EXTRA_STACKS: ${{ inputs.enable_extra_proxy_stacks }}
        run: |
          set -euo pipefail

          add_if_present() {
            local pkg="$1"
            if find package feeds -maxdepth 4 -name "$pkg" -print -quit 2>/dev/null | grep -q .; then
              echo "CONFIG_PACKAGE_${pkg}=y" >> .config
              echo "[OK] ${pkg}"
            else
              echo "[WARN] skip unavailable package: ${pkg}"
            fi
          }

          if ! find package/openclash -maxdepth 2 -type f -name Makefile -print -quit | grep -q .; then
            echo '[FATAL] OpenClash source tree not found.' >&2
            exit 1
          fi

          # 虚拟化组件与 iStore 核心生态
          add_if_present qemu-ga
          add_if_present luci-app-store
          add_if_present luci-app-quickstart
          add_if_present luci-app-diskman

          if [ "$BACKUP_PROXY" = 'true' ]; then
            add_if_present luci-app-passwall
            add_if_present luci-app-passwall2
          fi

          if [ "$EXTRA_STACKS" = 'true' ]; then
            add_if_present luci-app-nikki
            add_if_present luci-app-homeproxy
            add_if_present luci-app-mosdns
            add_if_present luci-app-smartdns
            add_if_present smartdns
            add_if_present xray-core
            add_if_present sing-box
          fi

          make defconfig

      - name: Resolve package file conflicts
        working-directory: istoreos
        shell: bash
        run: |
          set -euo pipefail

          pkg_on()  { grep -q "^CONFIG_PACKAGE_${1}=y" .config; }
          pkg_off() {
            sed -i "/^CONFIG_PACKAGE_${1}=/d;/^# CONFIG_PACKAGE_${1} is not set/d" .config
            echo "# CONFIG_PACKAGE_${1} is not set" >> .config
          }
          pkg_set() {
            sed -i "/^CONFIG_PACKAGE_${1}=/d;/^# CONFIG_PACKAGE_${1} is not set/d" .config
            echo "CONFIG_PACKAGE_${1}=y" >> .config
          }
          who_selects() {
            echo "----- 依赖/选择 ${1} 的来源 -----"
            [ -f tmp/.config-package.in ] || { echo '  (tmp/.config-package.in 不存在)'; return 0; }
            awk -v t="PACKAGE_${1}" '
              /^config /{cur=$2}
              $0 ~ ("select " t "($|[ \t])") {print "  <- " cur}
            ' tmp/.config-package.in | sort -u | head -n 20 || true
          }

          resolve_family() {
            local keep="$1" drops="$2" alt
            for alt in ${drops//,/ }; do
              if pkg_on "$keep" && pkg_on "$alt"; then
                echo "[CONFLICT] ${keep} 与 ${alt} 冲突，开始自动处理"
                pkg_off "$alt"
                make defconfig >/dev/null 2>&1
                if pkg_on "$alt"; then
                  echo "[INFO] ${alt} 被强制依赖重新选择，转为剔除 ${keep}"
                  who_selects "$alt"
                  pkg_off "$keep"
                  pkg_set "$alt"
                  make defconfig >/dev/null 2>&1
                  if pkg_on "$keep"; then
                    echo "::error::${keep} 与 ${alt} 均被硬依赖选中，无法自动解决冲突。"
                    who_selects "$keep"
                    exit 1
                  fi
                  echo "[FIXED] 保留 ${alt}，关闭 ${keep}"
                else
                  echo "[FIXED] 保留 ${keep}，关闭 ${alt}"
                fi
              fi
            done
          }

          for round in 1 2; do
            resolve_family libustream-mbedtls libustream-openssl,libustream-wolfssl
            resolve_family tcpdump tcpdump-mini
            resolve_family dnsmasq-full dnsmasq,dnsmasq-dhcpv6
            resolve_family ip-full ip-tiny,ip-bridge
            resolve_family wget-ssl wget-nossl
          done

          n_ssl=0
          for p in libustream-mbedtls libustream-openssl libustream-wolfssl; do pkg_on "$p" && n_ssl=$((n_ssl+1)); done
          if [ "$n_ssl" -gt 1 ]; then echo '::error::libustream-* 仍有多个包处于开启状态'; exit 1; fi

          echo '===== FINAL CONFLICT CHECK ====='
          for pair in libustream-mbedtls:libustream-openssl tcpdump:tcpdump-mini dnsmasq-full:dnsmasq ip-full:ip-tiny wget-ssl:wget-nossl; do
            a="${pair%%:*}"; b="${pair##*:}"
            if pkg_on "$a" && pkg_on "$b"; then
              echo "::error::互斥文件冲突依然存在: ${a} + ${b}"; exit 1
            fi
          done
          grep -E '^CONFIG_PACKAGE_(libustream-[a-z]+|tcpdump(-mini)?|dnsmasq(-full|-dhcpv6)?|ip-(full|tiny|bridge)|wget-(ssl|nossl))=' .config || true
          echo '[OK] 互斥包排查完毕，无冲突项'

      - name: Inject RouterOS bypass runtime files
        working-directory: istoreos
        shell: bash
        env:
          ENABLE_BBR: ${{ inputs.enable_bbr }}
          IN_IP: ${{ inputs.lan_ipaddr }}
          IN_MASK: ${{ inputs.lan_netmask }}
          IN_GW: ${{ inputs.lan_gateway }}
        run: |
          set -euo pipefail

          mkdir -p files/etc/uci-defaults files/etc/openclash/custom files/etc/sysctl.d \
                   files/usr/bin files/etc/init.d files/etc/config files/etc/routeros-bypass files/root

          # OKTV 直连规则（含必须的 "rules:" 标签声明）
          cat > files/etc/openclash/custom/openclash_custom_rules.list <<'EOF'
          rules:
          - DOMAIN-SUFFIX,hidns.vip,DIRECT
          - DOMAIN-SUFFIX,cmliussss.com,DIRECT
          - DOMAIN-SUFFIX,090227.xyz,DIRECT
          - DOMAIN,tvbbox.pgjgr.eu.cc,DIRECT
          EOF

          # 内核网络参数调优（适配 x86 旁路由高并发/UDP/长肥管道）
          cat > files/etc/sysctl.d/98-routeros-bypass-v2.conf <<'EOF'
          # RouterOS main router + iStoreOS bypass router
          net.ipv4.ip_forward = 1
          net.ipv4.tcp_slow_start_after_idle = 0
          net.ipv4.tcp_mtu_probing = 1
          net.ipv4.tcp_fastopen = 3
          net.ipv4.tcp_syncookies = 1
          net.ipv4.tcp_moderate_rcvbuf = 1
          net.ipv4.tcp_no_metrics_save = 1
          net.ipv4.tcp_tw_reuse = 1
          net.ipv4.ip_local_port_range = 10240 65535
          net.core.rmem_max = 16777216
          net.core.wmem_max = 16777216
          net.ipv4.tcp_rmem = 4096 131072 16777216
          net.ipv4.tcp_wmem = 4096 65536 16777216
          net.ipv4.udp_rmem_min = 16384
          net.ipv4.udp_wmem_min = 16384
          net.core.netdev_max_backlog = 16384
          net.core.somaxconn = 4096
          net.netfilter.nf_conntrack_tcp_timeout_established = 7200
          net.netfilter.nf_conntrack_udp_timeout = 30
          net.netfilter.nf_conntrack_udp_timeout_stream = 60
          EOF

          if [ "$ENABLE_BBR" = 'true' ]; then
            echo 1 > files/etc/routeros-bypass/bbr
          fi

          {
            echo "LAN_IP='${IN_IP}'"
            echo "LAN_MASK='${IN_MASK}'"
            echo "LAN_GW='${IN_GW}'"
          } > files/etc/routeros-bypass/lan.conf

          # apply / direct 模式切换工具
          cat > files/usr/bin/routeros-bypass-apply <<'EOF'
          #!/bin/sh
          set -u

          log() { logger -t routeros-bypass-v2 -- "$*"; echo "$*"; }
          uget() { uci -q get "$1" 2>/dev/null || true; }

          case "${1:-apply}" in
            apply)
              log "Applying RouterOS-bypass baseline..."
              changed_dns=0

              if uci -q get dhcp.lan >/dev/null 2>&1; then
                uci set dhcp.lan.ignore='1'
                uci set dhcp.lan.ra='disabled'
                uci set dhcp.lan.dhcpv6='disabled'
                uci set dhcp.lan.ndp='disabled'
              fi

              for s in $(uci show dhcp 2>/dev/null | sed -n 's/^dhcp\.\([^.=]*\)=odhcpd$/\1/p'); do
                uci set "dhcp.${s}.ra=disabled" 2>/dev/null || true
                uci set "dhcp.${s}.dhcpv6=disabled" 2>/dev/null || true
                uci set "dhcp.${s}.ndp=disabled" 2>/dev/null || true
              done

              if uci -q get firewall.@defaults[0] >/dev/null 2>&1; then
                uci set firewall.@defaults[0].flow_offloading='0'
                uci set firewall.@defaults[0].flow_offloading_hw='0'
              fi

              if uci -q get openclash.config >/dev/null 2>&1; then
                uci set openclash.config.enable_custom_clash_rules='1' 2>/dev/null || true
                uci set openclash.config.enable_respect_rules='1' 2>/dev/null || true
                uci set openclash.config.enable_redirect_dns='1' 2>/dev/null || true
                uci set openclash.config.en_mode='fake-ip-tun' 2>/dev/null || true
                uci set openclash.config.stack_type='mixed' 2>/dev/null || true
                uci set openclash.config.disable_masq_cache='1' 2>/dev/null || true
                uci set openclash.config.skip_proxy_address='1' 2>/dev/null || true
                uci set openclash.config.ipv6_enable='0' 2>/dev/null || true
              fi

              yaml=''
              for f in /etc/openclash/config/*.yaml /etc/openclash/config/*.yml; do
                [ -s "$f" ] || continue
                [ -z "$yaml" ] && yaml="$f"
              done

              if [ -n "$yaml" ] && uci -q get openclash.config >/dev/null 2>&1 && uci -q get dhcp.@dnsmasq[0] >/dev/null 2>&1; then
                cur_srv="$(uget dhcp.@dnsmasq[0].server)"
                cur_nr="$(uget dhcp.@dnsmasq[0].noresolv)"
                cur_cs="$(uget dhcp.@dnsmasq[0].cachesize)"
                if [ "$cur_srv" != "127.0.0.1#1053" ] || [ "$cur_nr" != "1" ] || [ "$cur_cs" != "0" ]; then
                  uci set dhcp.@dnsmasq[0].noresolv='1'
                  uci -q delete dhcp.@dnsmasq[0].server
                  uci add_list dhcp.@dnsmasq[0].server='127.0.0.1#1053'
                  uci set dhcp.@dnsmasq[0].cachesize='0'
                  changed_dns=1
                fi
              else
                log "No usable OpenClash YAML yet; keeping normal system DNS."
              fi

              uci commit dhcp 2>/dev/null || true
              uci commit firewall 2>/dev/null || true
              uci commit openclash 2>/dev/null || true

              if [ "$changed_dns" -eq 1 ]; then
                /etc/init.d/dnsmasq restart >/dev/null 2>&1 || true
                /etc/init.d/openclash enable >/dev/null 2>&1 || true
                /etc/init.d/openclash restart >/dev/null 2>&1 || true
                log "DNS chain enabled: dnsmasq :53 -> OpenClash 127.0.0.1:1053"
              fi
              /etc/init.d/firewall reload >/dev/null 2>&1 || true
              exit 0
              ;;

            direct)
              log "Restoring direct DNS mode (rollback)."
              if uci -q get dhcp.@dnsmasq[0] >/dev/null 2>&1; then
                uci set dhcp.@dnsmasq[0].noresolv='0'
                uci set dhcp.@dnsmasq[0].cachesize='150'
                uci -q delete dhcp.@dnsmasq[0].server
              fi
              uci commit dhcp 2>/dev/null || true
              /etc/init.d/dnsmasq restart >/dev/null 2>&1 || true
              /etc/init.d/openclash stop >/dev/null 2>&1 || true
              exit 0
              ;;

            *)
              echo "Usage: routeros-bypass-apply [apply|direct]"
              exit 1
              ;;
          esac
          EOF
          chmod 755 files/usr/bin/routeros-bypass-apply

          # 防抖健康监测脚本（连续 2 次探针失联触发重置，内置 15 分钟冷却期）
          cat > files/usr/bin/routeros-bypass-health <<'EOF'
          #!/bin/sh
          set -u

          TAG=routeros-bypass-health
          LOCK=/var/run/routeros-bypass-health.lock
          LOG=/var/log/routeros-bypass-health.log
          FAIL=/tmp/routeros-bypass-health.fail
          COOL=/tmp/routeros-bypass-health.cooldown
          MAX=5242880

          mkdir "$LOCK" 2>/dev/null || exit 0
          trap 'rmdir "$LOCK" 2>/dev/null || true' EXIT INT TERM

          log() {
            line="$(date '+%F %T') $*"
            logger -t "$TAG" -- "$*"
            printf '%s\n' "$line" >> "$LOG"
            [ -f "$LOG" ] && [ "$(wc -c < "$LOG")" -gt "$MAX" ] && tail -c 2621440 "$LOG" > "$LOG.tmp" && mv "$LOG.tmp" "$LOG"
          }

          uci -q get openclash.config >/dev/null 2>&1 || exit 0
          [ "$(uci -q get openclash.config.enable 2>/dev/null || echo 0)" = "1" ] || exit 0

          yaml_found=0
          for f in /etc/openclash/config/*.yaml /etc/openclash/config/*.yml; do
            [ -s "$f" ] && yaml_found=1 && break
          done
          [ "$yaml_found" -eq 1 ] || exit 0

          now="$(date +%s)"
          in_cooldown=0
          if [ -f "$COOL" ]; then
            last="$(cat "$COOL" 2>/dev/null || echo 0)"
            [ $((now - last)) -lt 900 ] && in_cooldown=1
          fi

          restart_openclash() {
            if [ "$in_cooldown" -eq 1 ]; then log "$1 (冷却中，跳过重启)"; return 0; fi
            log "$1 -> restarting OpenClash"
            /etc/init.d/openclash restart >/dev/null 2>&1 || true
            echo "$now" > "$COOL"
            sleep 5
          }

          if ! pgrep -f 'clash_meta|mihomo' >/dev/null 2>&1; then
            restart_openclash "Mihomo core process absent"
            exit 0
          fi

          probe_ok=1
          if command -v nslookup >/dev/null 2>&1; then
            out="$(timeout 6 nslookup www.baidu.com 127.0.0.1 2>&1 || true)"
            case "$out" in
              *"Address"*|*"NXDOMAIN"*|*"can't resolve"*) probe_ok=1 ;;
              *) probe_ok=0 ;;
            esac
          fi

          if [ "$probe_ok" -eq 0 ]; then
            n=0; [ -f "$FAIL" ] && n="$(cat "$FAIL" 2>/dev/null || echo 0)"
            n=$((n + 1)); echo "$n" > "$FAIL"
            log "Local DNS probe failed (${n} consecutive)"
            if [ "$n" -ge 2 ]; then
              /etc/init.d/dnsmasq restart >/dev/null 2>&1 || true
              restart_openclash "Local DNS chain broken"
              echo 0 > "$FAIL"
            fi
          else
            echo 0 > "$FAIL"
          fi

          if command -v curl >/dev/null 2>&1; then
            curl -4 -fsS -I --max-time 8 https://tvbbox.pgjgr.eu.cc/ >/dev/null 2>&1 \
              && log "OKTV remote HTTPS check: PASS" \
              || log "OKTV remote HTTPS check: FAIL (observation only)"
            curl -4 -fsS --max-time 8 https://www.gstatic.com/generate_204 >/dev/null 2>&1 \
              && log "Google 204 check: PASS" \
              || log "Google 204 check: FAIL (observation only)"
          fi
          EOF
          chmod 755 files/usr/bin/routeros-bypass-health

          # Init 服务：应用 sysctl、启用 BBR、动态分配连接跟踪容量
          cat > files/etc/init.d/routeros-bypass-v2 <<'EOF'
          #!/bin/sh /etc/rc.common
          START=95
          STOP=05
          USE_PROCD=0

          start() {
            sysctl -e -q -p /etc/sysctl.d/98-routeros-bypass-v2.conf >/dev/null 2>&1 || true

            if [ -f /etc/routeros-bypass/bbr ]; then
              modprobe tcp_bbr >/dev/null 2>&1 || true
              avail="$(sysctl -n net.ipv4.tcp_available_congestion_control 2>/dev/null || true)"
              case " $avail " in
                *" bbr "*)
                  sysctl -w net.ipv4.tcp_congestion_control=bbr >/dev/null 2>&1 || true
                  logger -t routeros-bypass-v2 "BBR enabled"
                  ;;
                *) logger -t routeros-bypass-v2 "BBR not available in this kernel; keeping default" ;;
              esac
            fi

            mem_mb=$(awk '/MemTotal:/ {printf "%d", $2/1024}' /proc/meminfo 2>/dev/null || echo 2048)
            if [ "$mem_mb" -ge 6144 ]; then
              max=262144
            elif [ "$mem_mb" -ge 3072 ]; then
              max=131072
            else
              max=65536
            fi
            sysctl -w "net.netfilter.nf_conntrack_max=$max" >/dev/null 2>&1 || true

            logger -t routeros-bypass-v2 "baseline loaded; conntrack_max=$max"
            /usr/bin/routeros-bypass-apply apply >/dev/null 2>&1 || true
          }

          stop() { :; }
          EOF
          chmod 755 files/etc/init.d/routeros-bypass-v2

          # 开机初次配置引导
          cat > files/etc/uci-defaults/99-routeros-bypass-v2 <<'EOF'
          #!/bin/sh
          set -u

          [ -f /etc/routeros-bypass/lan.conf ] && . /etc/routeros-bypass/lan.conf
          LAN_IP="${LAN_IP:-}"; LAN_MASK="${LAN_MASK:-255.255.255.0}"; LAN_GW="${LAN_GW:-}"

          if [ -n "$LAN_IP" ] && uci -q get network.lan >/dev/null 2>&1; then
            uci set network.lan.proto='static'
            uci set network.lan.ipaddr="$LAN_IP"
            uci set network.lan.netmask="$LAN_MASK"
            if [ -n "$LAN_GW" ]; then
              uci set network.lan.gateway="$LAN_GW"
              uci -q delete network.lan.dns
              uci add_list network.lan.dns="$LAN_GW"
            fi
            uci -q delete network.lan.ip6assign
          fi

          if uci -q get network.globals >/dev/null 2>&1; then
            uci set network.globals.packet_steering='1'
          fi
          uci commit network 2>/dev/null || true

          if uci -q get dhcp.lan >/dev/null 2>&1; then
            uci set dhcp.lan.ignore='1'
            uci set dhcp.lan.ra='disabled'
            uci set dhcp.lan.dhcpv6='disabled'
            uci set dhcp.lan.ndp='disabled'
          fi

          for s in $(uci show dhcp 2>/dev/null | sed -n 's/^dhcp\.\([^.=]*\)=odhcpd$/\1/p'); do
            uci set "dhcp.${s}.ra=disabled" 2>/dev/null || true
            uci set "dhcp.${s}.dhcpv6=disabled" 2>/dev/null || true
            uci set "dhcp.${s}.ndp=disabled" 2>/dev/null || true
          done

          if uci -q get firewall.@defaults[0] >/dev/null 2>&1; then
            uci set firewall.@defaults[0].flow_offloading='0'
            uci set firewall.@defaults[0].flow_offloading_hw='0'
          fi

          uci commit dhcp 2>/dev/null || true
          uci commit firewall 2>/dev/null || true

          if uci -q get openclash.config >/dev/null 2>&1; then
            uci set openclash.config.enable_custom_clash_rules='1' 2>/dev/null || true
            uci set openclash.config.enable_respect_rules='1' 2>/dev/null || true
            uci set openclash.config.enable_redirect_dns='1' 2>/dev/null || true
            uci set openclash.config.en_mode='fake-ip-tun' 2>/dev/null || true
            uci set openclash.config.stack_type='mixed' 2>/dev/null || true
            uci set openclash.config.disable_masq_cache='1' 2>/dev/null || true
            uci set openclash.config.skip_proxy_address='1' 2>/dev/null || true
            uci set openclash.config.ipv6_enable='0' 2>/dev/null || true
            if [ -x /etc/openclash/core/clash_meta ]; then
              uci set openclash.config.core_type='Meta' 2>/dev/null || true
            fi
            uci commit openclash || true
          fi

          for s in /etc/init.d/openbox /etc/init.d/open-box; do
            if [ -x "$s" ]; then
              "$s" stop >/dev/null 2>&1 || true
              "$s" disable >/dev/null 2>&1 || true
            fi
          done

          /etc/init.d/routeros-bypass-v2 enable >/dev/null 2>&1 || true

          CRON=/etc/crontabs/root
          touch "$CRON"
          grep -q '/usr/bin/routeros-bypass-health' "$CRON" 2>/dev/null || \
            echo '*/5 * * * * /usr/bin/routeros-bypass-health >/dev/null 2>&1' >> "$CRON"
          /etc/init.d/cron enable >/dev/null 2>&1 || true

          rm -f /etc/uci-defaults/99-routeros-bypass-v2
          exit 0
          EOF
          chmod 755 files/etc/uci-defaults/99-routeros-bypass-v2

          cat > files/root/openbox-install-latest.sh <<'EOF'
          #!/bin/sh
          set -eu
          dest=/tmp/openbox-install.sh
          urls="\
          https://gh-proxy.org/https://raw.githubusercontent.com/liandu2024/Open-Box/main/scripts/install.sh \
          https://gh-proxy.com/raw.githubusercontent.com/liandu2024/Open-Box/main/scripts/install.sh \
          https://ghproxy.net/raw.githubusercontent.com/liandu2024/Open-Box/main/scripts/install.sh \
          https://ghfast.top/raw.githubusercontent.com/liandu2024/Open-Box/main/scripts/install.sh"
          ok=0
          for u in $urls; do
            if curl -4 -L --fail --connect-timeout 10 --max-time 120 -o "$dest" "$u"; then
              if head -n 1 "$dest" | grep -q '^#!/bin/sh$' && grep -q 'REPO="liandu2024/Open-Box"' "$dest"; then
                ok=1
                break
              fi
            fi
          done
          [ "$ok" -eq 1 ] || { echo 'Open-Box installer download failed.' >&2; exit 1; }
          chmod 700 "$dest"
          exec sh "$dest" --mirror --port 3036
          EOF
          chmod 700 files/root/openbox-install-latest.sh

          cat > files/root/ROUTEROS-BYPASS-V2-README.txt <<'EOF'
          iStoreOS 24.10.8 RouterOS 主路由 + 旁路由 V2.2

          Fixed/static:
          - IPv4-only policy on the bypass router; DHCP/RA/DHCPv6 off.
          - OpenClash primary DNS/TUN controller; dnsmasq :53 -> 127.0.0.1:1053.
          - Fake-IP-TUN baseline, mixed stack, respect-rules and custom rules.
          - Flow offloading is disabled.
          - OKTV direct rules: hidns.vip / cmliussss.com / 090227.xyz / tvbbox.pgjgr.eu.cc
          - TCP/UDP buffers up to 16MB, BBR, conntrack timeouts tuned.

          Useful commands:
          routeros-bypass-apply apply
          routeros-bypass-apply direct
          routeros-bypass-health
          sysctl net.ipv4.tcp_congestion_control
          EOF

      - name: Preload Mihomo core and geodata (best effort)
        if: inputs.preload_openclash_core == true
        working-directory: istoreos
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p files/etc/openclash/core
          tmp="$(mktemp -d)"

          fetch() {
            for i in 1 2 3; do
              curl -fL --retry 2 --connect-timeout 15 --max-time 300 -o "$2" "$1" && return 0
              sleep 5
            done
            return 1
          }

          core_ok=0
          for url in \
            "https://raw.githubusercontent.com/vernesong/OpenClash/core/master/meta/clash-linux-amd64.tar.gz" \
            "https://github.com/vernesong/OpenClash/raw/core/master/meta/clash-linux-amd64.tar.gz"; do
            if fetch "$url" "$tmp/core.tar.gz" && tar -xzf "$tmp/core.tar.gz" -C "$tmp" 2>/dev/null; then
              bin="$(find "$tmp" -maxdepth 2 -type f \( -name 'clash' -o -name 'clash_meta' -o -name 'mihomo' \) | head -n 1)"
              if [ -n "$bin" ] && chmod +x "$bin" && "$bin" -v 2>&1 | head -n 1 | grep -qi 'meta\|mihomo'; then
                install -m 755 "$bin" files/etc/openclash/core/clash_meta
                echo "[OK] core preloaded: $(files/etc/openclash/core/clash_meta -v 2>&1 | head -n 1)"
                core_ok=1
                break
              fi
            fi
          done
          [ "$core_ok" -eq 1 ] || echo '[WARN] Mihomo core not preloaded; OpenClash will download it in LuCI on first run.'

          for f in geoip.dat geosite.dat country.mmdb; do
            url="https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/${f}"
            if fetch "$url" "$tmp/$f" && [ -s "$tmp/$f" ]; then
              case "$f" in
                geoip.dat)    install -m 644 "$tmp/$f" files/etc/openclash/GeoIP.dat ;;
                geosite.dat)  install -m 644 "$tmp/$f" files/etc/openclash/GeoSite.dat ;;
                country.mmdb) install -m 644 "$tmp/$f" files/etc/openclash/Country.mmdb ;;
              esac
              echo "[OK] $f"
            else
              echo "[WARN] $f not preloaded"
            fi
          done
          rm -rf "$tmp"
          exit 0

      - name: Finalize config and verify required target
        working-directory: istoreos
        shell: bash
        run: |
          set -euo pipefail
          make defconfig

          echo '===== TARGET CHECK ====='
          grep -E '^(CONFIG_TARGET_x86_64_DEVICE_generic|CONFIG_TARGET_ROOTFS_EXT4FS|CONFIG_TARGET_ROOTFS_PARTSIZE|CONFIG_GRUB_EFI_IMAGES|CONFIG_PACKAGE_luci-app-openclash|CONFIG_PACKAGE_kmod-tcp-bbr)=' .config || true

          echo '===== OPENCLASH CHECK ====='
          grep -n '^PKG_VERSION' package/openclash/luci-app-openclash/Makefile | head -n 1

          test "$(grep -c '^CONFIG_TARGET_x86_64_DEVICE_generic=y' .config || true)" -eq 1
          test "$(grep -c '^CONFIG_TARGET_ROOTFS_PARTSIZE=4096' .config || true)" -eq 1
          test "$(grep -c '^CONFIG_GRUB_EFI_IMAGES=y' .config || true)" -eq 1
          test "$(grep -c '^CONFIG_PACKAGE_luci-app-openclash=y' .config || true)" -eq 1
          test -f files/etc/uci-defaults/99-routeros-bypass-v2
          test -f files/usr/bin/routeros-bypass-health
          grep -q '^rules:' files/etc/openclash/custom/openclash_custom_rules.list

          for pair in libustream-mbedtls:libustream-openssl tcpdump:tcpdump-mini dnsmasq-full:dnsmasq ip-full:ip-tiny wget-ssl:wget-nossl; do
            a="${pair%%:*}"; b="${pair##*:}"
            if grep -q "^CONFIG_PACKAGE_${a}=y" .config && grep -q "^CONFIG_PACKAGE_${b}=y" .config; then
              echo "::error::冲突: ${a} + ${b}"; exit 1
            fi
          done
          echo '[OK] final config verified'

      - name: Download all sources
        working-directory: istoreos
        env:
          FORCE_UNSAFE_CONFIGURE: '1'
        shell: bash
        run: |
          set -euo pipefail
          make -j"$(nproc)" download V=s || make -j1 download V=s
          find dl -size -1024c -exec ls -l {} \; -exec rm -f {} \; || true

      - name: Save downloaded source archives
        if: always()
        uses: actions/cache/save@v4
        with:
          path: istoreos/dl
          key: istoreos-dl-${{ env.ISTOREOS_VERSION }}-${{ github.run_id }}

      - name: Build iStoreOS image
        working-directory: istoreos
        env:
          FORCE_UNSAFE_CONFIGURE: '1'
        shell: bash
        run: |
          set -euo pipefail
          if ! make -j"$(nproc)" world V=s 2>&1 | tee ../build.log; then
            echo '===== 并行构建失败，单线程重试以定位首个错误 ====='
            make -j1 world V=s 2>&1 | tee ../build-retry.log
          fi

      - name: Show image-assembly diagnostics on failure
        if: failure()
        shell: bash
        run: |
          for f in build.log build-retry.log; do
            [ -f "$f" ] || continue
            echo "===== $f: clashes / errors ====="
            grep -n -B2 -A8 'check_data_file_clashes' "$f" | head -n 80 || true
            grep -n -E 'Error [0-9]+|\* ERROR|Collected errors' "$f" | head -n 40 || true
          done

      - name: Collect firmware and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp -a istoreos/bin/targets/x86/64/* out/
          rm -rf out/packages

          {
            echo "Distribution=iStoreOS"
            echo "Version=${ISTOREOS_VERSION}"
            echo "Profile=x86_64 generic EFI"
            echo "ROOTFS_PARTSIZE=${ROOTFS_PARTSIZE} MiB"
            echo "OpenClash=${OPENCLASH_VERSION}"
            echo "V2=${V2_VERSION}"
            echo "BackupProxy=${{ inputs.enable_backup_proxy }}"
            echo "ExtraProxyStacks=${{ inputs.enable_extra_proxy_stacks }}"
            echo "BBR=${{ inputs.enable_bbr }}"
            echo "PreloadCore=${{ inputs.preload_openclash_core }}"
            echo "WorkflowRun=${GITHUB_RUN_ID}"
            echo "WorkflowRunNumber=${GITHUB_RUN_NUMBER}"
          } > out/build-info.txt

          cp istoreos/.config out/build.config
          (cd out && sha256sum ./*.img* ./*.gz ./*.bin 2>/dev/null || true) > out/sha256sums.txt
          ls -lah out
          echo '===== BUILD INFO ====='
          cat out/build-info.txt
          echo '===== SHA256 ====='
          cat out/sha256sums.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-24.10.8-x86_64-4G-efi-routeros-bypass-v2
          path: out/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            build-retry.log
            istoreos/.config
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish GitHub Release
        if: inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "istoreos-24.10.8-bypass-v2-${{ github.run_number }}"
          name: "iStoreOS 24.10.8 RouterOS Bypass V2.2 #${{ github.run_number }}"
          files: |
            out/*.gz
            out/*.txt
            out/*.manifest
            out/build.config
          generate_release_notes: true
